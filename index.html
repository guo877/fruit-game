<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport"content="width=device-width,initial-scale=1,user-scalable=no">
<title>大牛娱乐 · 五滚筒水果机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:"Microsoft YaHei",sans-serif;color:#fff;min-height:100vh;
 background:#1a0510 url('https://t1.chatglm.cn/file/6a96c6426e257def705dff3c.png?expired_at=1788698065&sign=646594995305169b2f6eaf27086454e2&ext=png') center/cover no-repeat fixed;
 display:flex;flex-direction:column;align-items:center;padding:8px}
body::after{content:'';position:fixed;inset:0;background:rgba(20,0,30,.55);z-index:-1}

#hd{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center;
 background:linear-gradient(90deg,#8a1a1a,#c0392b,#8a1a1a);border:2px solid #ffd700;
 border-radius:12px;padding:6px 12px;box-shadow:0 0 15px rgba(255,215,0,.3)}
#hd b{font-size:16px;color:#ffe600;text-shadow:0 0 8px #f80}
#hd .r{display:flex;gap:10px;align-items:center}
#score{font-size:18px;color:#ffe600;font-weight:bold;text-shadow:0 0 8px #f80}
#bgmBtn{cursor:pointer;font-size:18px}

#hist{width:100%;max-width:460px;display:flex;gap:4px;justify-content:center;margin:5px 0;min-height:26px}
#hist .h{width:26px;height:26px;border-radius:50%;border:1px solid #b8860b;
 background:rgba(40,5,60,.85);display:flex;align-items:center;justify-content:center;font-size:14px}
#hist .h.big{border-color:#ffe600;box-shadow:0 0 8px #ffd700}

/* ===== 金牛传说横幅 ===== */
#legend{width:100%;max-width:460px;text-align:center;font-size:12px;color:#ffd700;
 background:linear-gradient(90deg,transparent,rgba(255,180,0,.25),transparent);
 border:1px solid #b8860b;border-radius:8px;padding:4px;margin:2px 0;
 text-shadow:0 0 6px #f80;animation:legGlow 2s infinite}
#legend b{color:#fff}
@keyframes legGlow{50%{box-shadow:0 0 15px rgba(255,215,0,.5)}}

/* ===== 五滚筒机柜 ===== */
#cab{width:100%;max-width:460px;background:linear-gradient(180deg,#3d0a5c,#1a0510);
 border:4px solid #ffd700;border-radius:18px;padding:10px 6px;margin:2px auto 8px;
 box-shadow:0 0 25px rgba(255,215,0,.4),inset 0 0 25px rgba(0,0,0,.7);transition:box-shadow .4s}
#reels{display:flex;gap:5px;justify-content:center}
.tube{position:relative;width:17%;height:96px;border:2px solid #b8860b;border-radius:10px;
 overflow:hidden;background:linear-gradient(180deg,#12021f,#2d0a3d,#12021f);flex:1}
.tube.mid{border-color:#ffe600;box-shadow:0 0 12px rgba(255,215,0,.5)}
.tube .strip{position:absolute;left:0;top:0;width:100%;will-change:transform}
.tcell{height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tcell img{width:46px;height:46px;object-fit:contain;filter:drop-shadow(0 0 3px rgba(255,215,0,.4))}
.tcell small{font-size:9px;color:#ffd700}
.tube .mask{position:absolute;inset:0;pointer-events:none;z-index:3;
 background:linear-gradient(180deg,rgba(0,0,0,.72),transparent 32%,transparent 68%,rgba(0,0,0,.72))}
.tube .hit{position:absolute;left:6%;top:12%;width:88%;height:76%;border:2px solid transparent;
 border-radius:8px;pointer-events:none;z-index:4;transition:.2s}
.tube.stopped .hit{border-color:#ffe600;box-shadow:0 0 14px #ffd700,inset 0 0 14px rgba(255,215,0,.3)}
.tube.win .hit{border-color:#fff;box-shadow:0 0 25px #fff,0 0 40px #ffd700;animation:hb .3s 6}
@keyframes hb{50%{opacity:.4}}

/* ===== 控制区 ===== */
#ctrl{width:100%;max-width:460px;display:flex;gap:8px;align-items:center;justify-content:center;margin:2px 0}
#spinBtn{width:76px;height:76px;border-radius:50%;border:4px solid #ffd700;font-size:19px;
 font-weight:bold;color:#ffe600;line-height:1.2;cursor:pointer;flex-shrink:0;
 background:radial-gradient(circle at 32% 30%,#e74c3c,#7a0a0a);
 box-shadow:0 0 20px rgba(255,60,60,.6);animation:breath 1.6s infinite;text-shadow:0 0 6px #f00}
#spinBtn:disabled{filter:grayscale(.8);animation:none}
@keyframes breath{50%{box-shadow:0 0 40px #ff4040}}
#multi{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mbtn{width:88px;height:33px;border-radius:8px;border:2px solid #ffd700;font-size:14px;
 font-weight:bold;color:#ffe600;cursor:pointer;opacity:.55;transition:.15s;
 background:linear-gradient(180deg,#5a1060,#2d0a3d)}
.mbtn.sel{opacity:1;box-shadow:0 0 12px #ffd700;background:linear-gradient(180deg,#c0392b,#7a0a0a)}

#msg{min-height:22px;text-align:center;font-size:14px;color:#ffe600;margin:2px 0}

/* ===== 下注面板 ===== */
#bets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:460px}
.bopt{position:relative;background:rgba(40,5,60,.9);border:2px solid #b8860b;border-radius:12px;
 padding:6px 2px 4px;text-align:center;cursor:pointer;transition:.15s}
.bopt img{width:42px;height:42px;object-fit:contain}
.bopt .r{font-size:11px;color:#ffd700;font-weight:bold;margin:1px 0}
.bopt .b{font-size:12px;color:#7fdbff;min-height:15px}
.bopt.sel{border-color:#ffe600;background:rgba(90,20,120,.95);box-shadow:0 0 12px #ffd700}
.bopt .tag{position:absolute;top:0;left:0;background:linear-gradient(135deg,#ffd700,#ff8c00);
 color:#000;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:0 0 8px 0}
.bopt.jack{border-color:#ff4040;box-shadow:inset 0 0 12px rgba(255,60,60,.4)}
.bopt.jack .tag{background:linear-gradient(135deg,#ff4040,#a00);color:#fff}

body.win #flash{animation:wf .3s 6}
@keyframes wf{50%{filter:brightness(1.5)}}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9}
#modal.show{display:flex}
#modal .box{background:#2d0a3d;border:3px solid #ffd700;border-radius:16px;padding:26px 40px;
 text-align:center;box-shadow:0 0 40px rgba(255,215,0,.5)}
#modal .box b{font-size:44px;color:#ffe600;text-shadow:0 0 15px #f80}
#modal button{margin-top:14px;padding:10px 34px;font-size:16px;border:2px solid #7a0a0a;
 border-radius:24px;background:radial-gradient(circle at 35% 30%,#e74c3c,#7a0a0a);color:#ffe600;font-weight:bold}
</style>
</head>
<body>
<div id="flash" style="width:100%;display:flex;flex-direction:column;align-items:center">

<div id="hd"><b>🏮 大牛娱乐 🏮</b>
 <div class="r"><span id="bgmBtn">🎵</span><span>💰<span id="score">10000</span></span></div></div>

<div id="hist"></div>
<div id="legend">🐂 传说：五轴一线金牛王 = <b>x888</b> 至尊大奖 · 💰 财神现身 = x88</div>

<div id="cab"><div id="reels"></div></div>

<div id="ctrl">
 <div id="multi">
  <button class="mbtn sel" data-m="10">注 x10</button>
  <button class="mbtn" data-m="20">注 x20</button>
  <button class="mbtn" data-m="50">注 x50</button>
  <button class="mbtn" data-m="100">注 x100</button>
 </div>
 <button id="spinBtn" onclick="startSpin()">开<br>始</button>
</div>

<div id="msg">选注额 → 点水果下注 → 按开始！</div>
<div id="bets"></div>

</div>
<div id="modal"><div class="box"><div id="mtext"></div><button onclick="closeModal()">确定</button></div></div>

<script>
/* ==================== 音效 ==================== */
let AC=null;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function beep(f,d,t,v){try{const o=ac().createOscillator(),g=ac().createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.value=v||.15;
 g.gain.exponentialRampToValueAtTime(.001,ac().currentTime+d);
 o.connect(g);g.connect(ac().destination);o.start();o.stop(ac().currentTime+d)}catch(e){}}
const sndTick=()=>beep(900,.03,'square',.06),sndBet=()=>beep(660,.08,'sine',.2);
const sndWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.22,'triangle',.25),i*110));
const sndLose=()=>{beep(300,.2,'sawtooth',.1);setTimeout(()=>beep(200,.3,'sawtooth',.1),200)};
const sndStop=()=>beep(500,.12,'triangle',.25);
function sndBull(){ /* 牛角号+战鼓 */
 [110,110,147,110].forEach((f,i)=>setTimeout(()=>beep(f,.5,'sawtooth',.3),i*400));
 [60,60,60].forEach((f,i)=>setTimeout(()=>beep(f,.25,'sine',.4),i*300))}
const vib=m=>navigator.vibrate&&navigator.vibrate(m);

/* ==================== 欢快BGM ==================== */
let bgmOn=false,bgmT=null;
const MEL=[[523,140],[659,140],[784,140],[659,140],[880,140],[784,140],[659,280],
           [392,140],[494,140],[587,140],[494,140],[659,140],[587,140],[494,280],
           [440,140],[523,140],[659,140],[523,140],[698,140],[659,140],[523,280],
           [523,140],[659,140],[698,140],[784,140],[880,280],[1047,280]];
const CHD=[131,196,220,175];
function pn(f,d,t,v){try{const o=ac().createOscillator(),g=ac().createGain();
 o.type=t;o.frequency.value=f;g.gain.value=v;
 g.gain.exponentialRampToValueAtTime(.001,ac().currentTime+d/1000);
 o.connect(g);g.connect(ac().destination);o.start();o.stop(ac().currentTime+d/1000)}catch(e){}}
function startBGM(){if(bgmOn)return;bgmOn=true;let i=0,bt=0;
 (function p(){if(!bgmOn)return;const[f,d]=MEL[i%MEL.length];
  pn(f,d,'triangle',.07);
  if(i%7===0)pn(CHD[Math.floor(i/7)%4],420,'sine',.1);
  if(bt%4===0)pn(80,.1,'sine',.22);
  if(bt%4===2)pn(300,.05,'square',.05);
  bt++;i++;bgmT=setTimeout(p,d)})()}
function stopBGM(){bgmOn=false;clearTimeout(bgmT)}
document.getElementById('bgmBtn').onclick=()=>bgmOn?stopBGM():startBGM();
document.addEventListener('touchstart',function once(){startBGM();
 document.removeEventListener('touchstart',once)},{once:true});

/* ==================== 配置 ==================== */
const FRUITS=[
 {e:'🍒',img:'cherry',    r:100},
 {e:'🍋',img:'lemon',     r:40},
 {e:'🍇',img:'grape',     r:20},
 {e:'🥭',img:'mango',     r:10},
 {e:'🍎',img:'apple',     r:6},
 {e:'🍉',img:'melon',     r:4},
 {e:'🍊',img:'orange',    r:3},
 {e:'🍓',img:'strawberry',r:2}];
/* 特殊符号：9=金牛王(至尊) 10=财神 */
const SPECIAL={
 9:{e:'🐂',img:'bull',r:888,name:'金牛王'},
 10:{e:'💰',img:'god',r:88,name:'财神'}};
const K='niu_v8';
let score=+(localStorage.getItem(K)||10000),curM=10,bets={},spinning=false;

const IMG={
 cherry:'https://t1.chatglm.cn/file/6a96c643a6bd91091f593aa5.png?expired_at=1788698065&sign=9cb10cd5af63945a48db657b4608054a&ext=png',
 lemon:'https://t1.chatglm.cn/file/6a96c6417f2c8603553fc3de.png?expired_at=1788698065&sign=282eb325d65f3e6da6591699d810cda0&ext=png',
 grape:'https://t1.chatglm.cn/file/6a96c6426e257def705dff38.png?expired_at=1788698065&sign=6175be44efa2a357c9645a39ecf189ff&ext=png',
 mango:'https://t1.chatglm.cn/file/6a96c6436e257def705dff40.png?expired_at=1788698065&sign=4e2d76ca5ebfdb1fe4c8378d920c9428&ext=png',
 apple:'https://t1.chatglm.cn/file/6a96c6417f2c8603553fc3dd.png?expired_at=1788698065&sign=6b8e5cb4d2ddf36f47ff40b5ce8a869e&ext=png',
 orange:'https://t1.chatglm.cn/file/6a96c6427f2c8603553fc3df.png?expired_at=1788698065&sign=012b591de53ab2eefc81e09ae3297e67&ext=png',
 melon:'https://t1.chatglm.cn/file/6a96c6426e257def705dff3d.png?expired_at=1788698065&sign=029b525b8e6fb91629af83fa495c52f9&ext=png',
 strawberry:'https://t1.chatglm.cn/file/6a96c6436e257def705dff44.png?expired_at=1788698065&sign=a77e4bcd8e8752f18cfdc62294772b10&ext=png',
 bull:'https://t1.chatglm.cn/file/6a96d10741e8b2607a444ed7.png?expired_at=1788700835&sign=b7daa1f8adf61aa77f8e453866a62e26&ext=png',
 god:'https://t1.chatglm.cn/file/6a96d108a6bd91091f5964c8.png?expired_at=1788700835&sign=cc33dec47802036854048bf1726c165b&ext=png'};
function fruitHTML(f,s){const u=IMG[f.img];
 return `<img src="${u}" style="width:${s}px;height:${s}px;object-fit:contain" onerror="this.outerHTML='${f.e}'">`}

/* ==================== 抽奖逻辑 ==================== */
const POOL=[7,7,7,5,5,5,4,4,4,3,3,3,2,2,1,1,0];
let spinN=0,lastCh=0,lastBull=0;
const r8=()=>POOL[Math.floor(Math.random()*POOL.length)];
function drawSpecial(){spinN++;
 /* 金牛：300把后每把0.4%，约500把一次至尊奖 */
 if(spinN-lastBull>300&&Math.random()<.004){lastBull=spinN;return 9}
 /* 樱桃头奖走普通池限频 */
 if(spinN-lastCh>45&&Math.random()<.02){lastCh=spinN;return 0}
 /* 财神：约2% */
 if(Math.random()<.02)return 10;
 return r8()}  /* -1情况不存在，直接普通 */

/* ==================== 构建5滚筒 ==================== */
const CELL=96,SEQ=[0,4,1,5,2,6,3,7];
const tubes=[],reelsEl=document.getElementById('reels');
for(let t=0;t<5;t++){
 const tube=document.createElement('div');
 tube.className='tube'+(t===2?' mid':'');
 tube.innerHTML='<div class="strip"></div><div class="mask"></div><div class="hit"></div>';
 reelsEl.appendChild(tube);
 const strip=tube.querySelector('.strip'),cells=[];
 const seq=[...SEQ.slice(t%8),...SEQ.slice(0,t%8)];
 for(let L=0;L<8;L++)seq.forEach(i=>{
  const d=document.createElement('div');d.className='tcell';
  d.innerHTML=fruitHTML(FRUITS[i],46)+'<small>x'+FRUITS[i].r+'</small>';
  strip.appendChild(d);cells.push({el:d,fi:i})});
 tubes.push({tube,strip,cells,pos:Math.random()*8*CELL,speed:.28+t*.05})}

/* 待机不同速循环 */
let idleOn=true;
function idleAll(){
 if(!idleOn)return;
 tubes.forEach(T=>{T.pos+=T.speed;
  if(T.pos>T.cells.length*CELL*2)T.pos-=8*CELL;
  T.strip.style.transform='translateY('+(-T.pos)+'px)'});
 requestAnimationFrame(idleAll)}
requestAnimationFrame(idleAll);

/* ==================== UI ==================== */
document.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{curM=+b.dataset.m;
 document.querySelectorAll('.mbtn').forEach(x=>x.classList.remove('sel'));
 b.classList.add('sel');sndBet()});
const betsEl=document.getElementById('bets');
FRUITS.forEach((f,i)=>{const d=document.createElement('div');
 d.className='bopt'+(f.r>=20?' jack':'');d.id='bo'+i;
 d.innerHTML='<div class="tag">x'+f.r+'</div>'+fruitHTML(f,42)+
  '<div class="r">'+(f.r>=20?'大奖':'赔率'+f.r)+'</div><div class="b" id="bb'+i+'">押0</div>';
 d.onclick=()=>bet(i);betsEl.appendChild(d)});
const save=()=>{localStorage.setItem(K,score);document.getElementById('score').textContent=score};
function bet(i){if(spinning)return;
 if(score<curM){toast('余额不足！');sndLose();return}
 score-=curM;bets[i]=(bets[i]||0)+curM;
 document.getElementById('bb'+i).textContent='押'+bets[i];
 document.getElementById('bo'+i).classList.add('sel');save();sndBet();vib(30)}
function toast(t){document.getElementById('msg').textContent=t}
const hist=[];
function pushHist(res){hist.unshift(res);if(hist.length>10)hist.pop();
 document.getElementById('hist').innerHTML=hist.map(i=>
  '<div class="h'+((i>=9||FRUITS[i]?.r>=20)?' big':'')+'">'+(i>=9?SPECIAL[i].e:FRUITS[i].e)+'</div>').join('')}

/* ==================== 单轴刹车动画 ==================== */
function spinTube(T,target,delay,dur,done){
 let t0=null,lastC=-1;
 setTimeout(function anim(){
  if(t0===null)t0=performance.now();
  const p=Math.min((performance.now()-t0)/dur,1);let e;
  if(p<.15)e=(p/.15)**2*.12;
  else if(p<.6)e=.12+(p-.15)/.45*.73;
  else{const q=(p-.6)/.4;e=.85+(1-(1-q)**3)*.15}
  T.pos=T.start+T.dist*e;
  T.strip.style.transform='translateY('+(-T.pos)+'px)';
  const c=Math.floor(T.pos/CELL);
  if(c!==lastC){lastC=c;sndTick();vib(8)}
  p<1?requestAnimationFrame(anim):(T.pos=T.stopPos,
   T.strip.style.transform='translateY('+(-T.pos)+'px)',
   T.tube.classList.add('stopped'),sndStop(),vib(40),done&&done())
 },delay)}
/* 预备：找停点并算距离 */
function prepTube(T,target){
 let stopIdx=-1;
 for(let c=0;c<T.cells.length;c++)
  if(T.cells[c].fi===target&&c*CELL+CELL/2>T.pos+CELL/2){stopIdx=c;break}
 if(stopIdx<0)stopIdx=Math.max(0,T.cells.findIndex(c=>c.fi===target));
 T.start=T.pos;T.stopPos=stopIdx*CELL;
 T.dist=(T.stopPos-T.start)+8*CELL*3}

/* ==================== 开奖 ==================== */
function startSpin(){if(spinning)return;
 if(!Object.values(bets).some(v=>v>0)){toast('先下注再开奖！');return}
 spinning=true;document.getElementById('spinBtn').disabled=true;
 sndBet();vib(50);idleOn=false;
 tubes.forEach(T=>T.tube.classList.remove('stopped','win'));

 const res=drawSpecial();
 if(res===9){bullSpin();return}   /* 🐂 至尊金牛局 */

 /* 普通/财神局：财神停第3轴，否则普通 */
 const target=res===10?10:res;
 const results=[r8(),r8(),target,r8(),r8()];
 tubes.forEach(T=>prepTube(T,results[tubes.indexOf(T)]));
 tubes.forEach((T,i)=>spinTube(T,results[i],i*450,2600,
  i===4?()=>setTimeout(()=>settle(target),400):null))}

/* ==================== 🐂 金牛局：五轴同刹 ==================== */
function bullSpin(){
 sndBull();
 tubes.forEach(T=>{
  /* 把每轴中央格替换成金牛 */
  const mid=Math.floor(T.cells.length/2);
  T.cells[mid].el.innerHTML=fruitHTML(SPECIAL[9],52)+'<small>x888</small>';
  T.cells[mid].fi=9;
  let stopIdx=-1;
  for(let c=0;c<T.cells.length;c++)
   if(T.cells[c].fi===9&&c*CELL+CELL/2>T.pos+CELL/2){stopIdx=c;break}
  if(stopIdx<0){T.cells.forEach((c,i)=>{if(c.fi!==9&&stopIdx<0)stopIdx=i});
   /* 强制替换该格为金牛 */
   T.cells[stopIdx].el.innerHTML=fruitHTML(SPECIAL[9],52)+'<small>x888</small>';
   T.cells[stopIdx].fi=9}
  T.start=T.pos;T.stopPos=stopIdx*CELL;
  T.dist=(T.stopPos-T.start)+8*CELL*4});
 /* 五轴同转同刹 */
 let t0=null;const dur=2800;
 (function anim(t){if(!t0)t0=t;
  const p=Math.min((t-t0)/dur,1);
  const e=p<.7?(p/.7)**2*.85:.85+(1-((1-(p-.7)/.3)**3))*.15;
  tubes.forEach(T=>{
   T.pos=T.start+T.dist*e;
   T.strip.style.transform='translateY('+(-T.pos)+'px)'});
  if(Math.floor(p*24)!==Math.floor((p-.02)*24))sndTick();
  if(p<1)requestAnimationFrame(anim);
  else{ /* 同刹瞬间：白金爆闪 */
   tubes.forEach(T=>{T.pos=T.stopPos;
    T.strip.style.transform='translateY('+(-T.pos)+'px)';
    T.tube.classList.add('stopped','win')});
   sndStop();vib([300,100,300,100,600]);
   document.getElementById('cab').style.boxShadow='0 0 80px #fff,0 0 120px #ffd700';
   burst(innerWidth/2,innerHeight/3);
   setTimeout(()=>burst(innerWidth/2,innerHeight*.55),300);
   setTimeout(()=>burst(innerWidth/2,innerHeight*.4),600);
   setTimeout(()=>settle(9),900)}})(performance.now())}

/* ==================== 结算 ==================== */
function settle(res){
 document.getElementById('cab').style.boxShadow='0 0 60px #ffe600,inset 0 0 40px rgba(255,215,0,.6)';
 setTimeout(()=>document.getElementById('cab').style.boxShadow='',1600);
 pushHist(res);vib([80,40,80]);
 let r,pay;
 if(res>=9){const S=SPECIAL[res];r=S.r;
  pay=Object.values(bets).reduce((a,b)=>a+b,0)*r}
 else{r=FRUITS[res].r;pay=(bets[res]||0)*FRUITS[res].r}
 bets={};FRUITS.forEach((_,i)=>{document.getElementById('bb'+i).textContent='押0';
  document.getElementById('bo'+i).classList.remove('sel')});
 document.body.classList.add('win');

 if(pay>0){score+=pay;save();
  if(res===9){ /* 至尊金牛 */
   toast('🐂🐂🐂 万中无一 · 金牛王 🐂🐂🐂');
   vib([500,100,500,100,1000]);sndWin();
   document.getElementById('mtext').innerHTML='🐂 金牛王 · 至尊奖 🐂<br><b style="font-size:56px">x888</b><br>赢得 '+pay;
   setTimeout(()=>document.getElementById('modal').classList.add('show'),1200)}
  else if(r>=40){toast('🎆 超级大奖 x'+r+'！🎆');
   burst(innerWidth/2,innerHeight/3);burst(innerWidth/2,innerHeight*.6);
   vib([200,100,200,100,400]);sndWin();
   document.getElementById('mtext').innerHTML='🎆 超级大奖 🎆<br><b>x'+r+'</b><br>赢得 '+pay;
   setTimeout(()=>document.getElementById('modal').classList.add('show'),400)}
  else if(r>=10){burst(innerWidth/2,innerHeight/2);sndWin();
   document.getElementById('mtext').innerHTML='🎉 大奖 🎉<br><b>x'+r+'</b><br>赢得 '+pay;
   setTimeout(()=>document.getElementById('modal').classList.add('show'),400)}
  else{toast('+'+pay+' 🎉');sndWin();vib(80);setTimeout(endRound,900);return}}
 else{sndLose();
  document.getElementById('mtext').innerHTML='😢 再接再厉！';
  setTimeout(()=>document.getElementById('modal').classList.add('show'),300)}}

function endRound(){document.body.classList.remove('win');spinning=false;
 tubes.forEach(T=>T.tube.classList.remove('stopped','win'));
 document.getElementById('spinBtn').disabled=false;
 toast('余额：'+score);idleOn=true;requestAnimationFrame(idleAll)}
function closeModal(){document.getElementById('modal').classList.remove('show');endRound()}

/* ==================== 金粒子 ==================== */
function burst(x,y){const cv=document.createElement('canvas');
 cv.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:8';
 cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);
 const cx=cv.getContext('2d');
 const ps=Array.from({length:70},()=>({x,y,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,
  c:`hsl(${Math.random()*60+30},100%,60%)`,s:Math.random()*6+3}));
 let t=0;(function a(){cx.clearRect(0,0,cv.width,cv.height);t++;
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;cx.fillStyle=p.c;
   cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()});
  t<85?requestAnimationFrame(a):cv.remove()})()}
save();
</script>
